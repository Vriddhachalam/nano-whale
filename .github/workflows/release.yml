name: Release

on:
  push:
    branches:
      - rust

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: nano-whale
            asset_name: nano-whale-linux-x86_64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: nano-whale
            asset_name: nano-whale-macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: nano-whale
            asset_name: nano-whale-macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: nano-whale.exe
            asset_name: nano-whale-windows-x86_64.exe

    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          
      - name: Build Target
        run: cargo build --release --target ${{ matrix.target }}
        
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: target/${{ matrix.target }}/release/${{ matrix.artifact_name }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          
      - name: Prepare Assets
        run: |
          mkdir release_assets
          # Move all downloaded artifacts into the flat release_assets directory
          find artifacts -type f -exec mv {} release_assets/ \;
          
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Continuous Build ${{ github.run_number }}
          files: release_assets/*
          generate_release_notes: true
