name: Automated Release

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build on ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y cmake g++ zip

      - name: Install dependencies (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install cmake zip

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Archive Binary (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: |
          mkdir -p releases
          tar -czvf releases/nano-whale-${{ runner.os }}.tar.gz -C build nano-whale
        
      - name: Archive Binary (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          mkdir releases
          Compress-Archive -Path build\Release\nano-whale.exe -DestinationPath releases\nano-whale-Windows.zip
          
      - name: Upload Release Asset
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: Release v2.0.${{ github.run_number }}
          generate_release_notes: true
          files: releases/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Upload Artifact (Manual Build)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: nano-whale-${{ runner.os }}
          path: releases/*
